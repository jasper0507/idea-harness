name: 功能建议
description: 希望在澄清流程、输出模板或工程化工具链上增强 Idea Harness。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Idea Harness 刻意保持 **窄而深**。请在建议前思考：这会削弱「只澄清、不乱猜」的边界吗？
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 用户或贡献者在什么场景下卡住？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望改动哪些文件（例如 SKILL.md、PRECISION-GATE.md）或流程？
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围自检
      options:
        - label: 我建议的改动不会默认诱导 AI 选择技术栈或生成代码
          required: true
